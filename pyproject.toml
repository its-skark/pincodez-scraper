[project]
name = "pincodez-scraper"
version = "0.1.0"
description = "Rate-limited scraper for pincodez.info producing a complete India postal address dataset"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
]

[project.scripts]
pincodez = "pincodez_scraper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pincodez_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
